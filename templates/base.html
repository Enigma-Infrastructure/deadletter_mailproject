{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}deadletter{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
</head>
<body>
  <div class="app-shell">

    <header>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <div>
          <a href="/">
            <img src="{% static 'img/deadletter_logo.jpg' %}" alt="deadletter" style="height: 50px; width: auto;">
          </a>
        </div>

        <nav style="display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: flex-end;">
          <!-- Participant flow -->
          <a class="btn" href="/write/request/">Request</a>
          <a class="btn" href="/letters/read/">Read</a>
          <a class="btn" href="/letters/desk/">Desk</a>

          <!-- Secondary: physical interface -->
          <a class="btn btn-secondary" href="/scan/">Scan</a>

          <!-- Secondary: game layer (authenticated only) -->
          {% if user.is_authenticated %}
          <a class="btn btn-secondary" href="/leaderboard/">Leaderboard</a>
          {% endif %}

          <!-- Auth -->
          {% if user.is_authenticated %}
          {% if user.is_staff %}
          <a class="btn btn-admin" href="/letters/print/queue/">Print</a>
          <a class="btn btn-admin" href="/admin/">Admin</a>
          {% endif %}
          <a class="btn btn-auth" href="/accounts/logout/">Log out</a>
          {% else %}
          <a class="btn btn-auth" href="/accounts/login/">Log in</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
