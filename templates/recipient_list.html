{% extends "base.html" %}
{% block content %}
<h1>Recipients (collaborators)</h1>
<ul>
  {% for person in people %}
    <li>
      {{ person.nickname }}
      {% if person.pirate_address_display %}
        – {{ person.pirate_address_display }}
      {% endif %}
    </li>
  {% endfor %}
</ul>
{% endblock %}
