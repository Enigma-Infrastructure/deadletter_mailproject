{% extends 'base.html' %}
{% block title %}Log in | deadletter{% endblock %}
{% block content %}
<section class="card" aria-labelledby="login-title">
  <h1 id="login-title">Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Log in</button>
  </form>
  <p style="margin-top: 1rem;">New here? <a href="{% url 'register' %}">Create an account</a>. Registration starts pending organizer approval. Signing in is not participant approval.</p>
</section>
{% endblock %}
